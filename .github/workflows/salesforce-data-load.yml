name: Salesforce Account Data Load

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      data_file_path:
        description: 'Path to the CSV file to process (for example data/account-names.csv)'
        required: false
        default: 'data/account-names.csv'

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: salesforce-data-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    environment:
      name: PROD
    env:
      REPO_ROOT: ${{ github.workspace }}
      SOURCE_FILE: data/account-names.csv
      ARTIFACT_DIR: /tmp/salesforce-artifacts
      WORKFLOW_NAME: ${{ github.workflow }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_USER: ${{ github.actor }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      SF_ORG_ALIAS: prod-integration
      SF_INSTANCE_URL: https://login.salesforce.com
      APPROVER: ${{ github.actor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js for Salesforce CLI
        uses: actions/setup-node@v3
        with:
          node-version: 22.4.1

      - name: Install Salesforce CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @salesforce/cli
          sf --version
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Resolve and validate inputs and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          : > "$ARTIFACT_DIR/execution.log"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Starting workflow execution" | tee -a "$ARTIFACT_DIR/execution.log"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            selected_file="${{ github.event.inputs.data_file_path }}"
            if [ -z "$selected_file" ]; then
              selected_file="data/account-names.csv"
            fi
          else
            selected_file="data/account-names.csv"
            changed_csv="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -E '^data/.*\.csv$' | head -n 1 || true)"
            if [ -n "$changed_csv" ]; then
              selected_file="$changed_csv"
            fi
          fi

          if [ ! -f "$selected_file" ]; then
            echo "Required input file not found: $selected_file" | tee -a "$ARTIFACT_DIR/execution.log"
            exit 1
          fi

          echo "SOURCE_FILE=$selected_file" >> "$GITHUB_ENV"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Resolved source file: $selected_file" | tee -a "$ARTIFACT_DIR/execution.log"

          if [ -z "${{ secrets.SF_CLIENT_ID }}" ] || [ -z "${{ secrets.SF_CLIENT_SECRET }}" ] || [ -z "${{ secrets.SF_LOGIN_URL }}" ]; then
            echo "Salesforce credentials are not fully configured in GitHub Secrets." | tee -a "$ARTIFACT_DIR/execution.log"
            exit 1
          fi
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Input validation passed" | tee -a "$ARTIFACT_DIR/execution.log"

      - name: Approval gate
        shell: bash
        run: |
          set -euo pipefail
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Approval is required via the PROD environment protection rules before Salesforce operations begin." | tee -a "$ARTIFACT_DIR/execution.log"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Workflow will not proceed until the environment approval is granted by an authorized reviewer." | tee -a "$ARTIFACT_DIR/execution.log"

      - name: Transform account data with Copilot agent
        shell: bash
        env:
          AGENT_SPEC_FILE: .copilot/agents/account-data-transformer.md
        run: |
          set -euo pipefail
          python3 scripts/transform-accounts.py \
            --input "$SOURCE_FILE" \
            --output "$ARTIFACT_DIR/transformed-accounts.csv" \
            --summary "$ARTIFACT_DIR/transformation-summary.json" \
            --log "$ARTIFACT_DIR/transformation.log" \
            --agent-spec "$AGENT_SPEC_FILE" | tee -a "$ARTIFACT_DIR/execution.log"

      - name: Authenticate to Salesforce
        id: auth
        shell: bash
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          SF_ORG_ALIAS: prod-integration
        run: |
          set -u
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Fetching Salesforce access token" | tee -a "$ARTIFACT_DIR/execution.log"
          set +e
          export SF_ACCESS_TOKEN="$(curl -sS -X POST "$SF_LOGIN_URL/services/oauth2/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d "grant_type=client_credentials" \
            -d "client_id=$SF_CLIENT_ID" \
            -d "client_secret=$SF_CLIENT_SECRET" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))')"
          auth_status=$?
          set -e

          if [ "$auth_status" -ne 0 ] || [ -z "$SF_ACCESS_TOKEN" ]; then
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Failed to retrieve Salesforce access token" | tee -a "$ARTIFACT_DIR/execution.log"
            echo "AUTH_STATUS=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Authorizing to Salesforce org" | tee -a "$ARTIFACT_DIR/execution.log"
          set +e
          sf org login access-token --instance-url "$SF_LOGIN_URL" --access-token "$SF_ACCESS_TOKEN" --alias "$SF_ORG_ALIAS" --set-default --no-prompt | tee -a "$ARTIFACT_DIR/execution.log"
          auth_status=$?
          set -e

          if [ "$auth_status" -ne 0 ]; then
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Salesforce CLI login failed" | tee -a "$ARTIFACT_DIR/execution.log"
            echo "AUTH_STATUS=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "AUTH_STATUS=ok" >> "$GITHUB_OUTPUT"
          echo "SF_INSTANCE_URL=$SF_LOGIN_URL" >> "$GITHUB_ENV"
          echo "SF_ORG_ALIAS=$SF_ORG_ALIAS" >> "$GITHUB_ENV"

      - name: Load accounts into Salesforce
        shell: bash
        env:
          INPUT_FILE: /tmp/salesforce-artifacts/transformed-accounts.csv
          OUTPUT_FILE: /tmp/salesforce-artifacts/salesforce-import-results.json
        run: |
          set -u
          if [ "${{ steps.auth.outputs.AUTH_STATUS }}" != "ok" ]; then
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Skipping Salesforce load because authentication did not complete successfully" | tee -a "$ARTIFACT_DIR/execution.log"
            echo '{"source_file":"'"$INPUT_FILE"'","sobject":"Account","operation":"insert","records_processed":0,"successful_records":0,"failed_records":0,"records":[],"job_information":{"tool":"sf data create record","operation":"insert","sobject":"Account"}}' > "$OUTPUT_FILE"
            exit 0
          fi

          set +e
          bash scripts/load-accounts.sh | tee -a "$ARTIFACT_DIR/execution.log"
          load_status=$?
          set -e

          if [ "$load_status" -ne 0 ]; then
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Salesforce load step failed" | tee -a "$ARTIFACT_DIR/execution.log"
            exit 0
          fi

      - name: Generate audit report
        if: ${{ always() }}
        shell: bash
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          TRIGGER_TYPE: ${{ github.event_name }}
          GITHUB_USER: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_SHA: ${{ github.sha }}
          APPROVER: ${{ github.actor }}
          SOURCE_FILE: ${{ env.SOURCE_FILE }}
          SF_ORG_ALIAS: prod-integration
          SF_INSTANCE_URL: ${{ env.SF_INSTANCE_URL }}
        run: |
          set -euo pipefail
          python3 scripts/generate-audit-report.py \
            --summary "$ARTIFACT_DIR/transformation-summary.json" \
            --import-results "$ARTIFACT_DIR/salesforce-import-results.json" \
            --audit-file "$ARTIFACT_DIR/audit-report.json" \
            --workflow-name "$WORKFLOW_NAME" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --trigger "$TRIGGER_TYPE" \
            --github-user "$GITHUB_USER" \
            --pr-number "$PR_NUMBER" \
            --commit-sha "$GITHUB_SHA" \
            --approver "$APPROVER" \
            --source-file "$SOURCE_FILE" \
            --org-alias "$SF_ORG_ALIAS" \
            --instance-url "$SF_INSTANCE_URL" \
            --log-file "$ARTIFACT_DIR/execution.log" | tee -a "$ARTIFACT_DIR/execution.log"

      - name: Publish workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Salesforce data deployment summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: $WORKFLOW_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source file: $SOURCE_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifacts: transformed-accounts.csv, transformation-summary.json, salesforce-import-results.json, audit-report.json, execution.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.4.0
        with:
          name: salesforce-data-load-artifacts
          path: |
            /tmp/salesforce-artifacts/
          if-no-files-found: error
